<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="100%" height="100%">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#1E1E2E"/>
    </linearGradient>

    <!-- Logo icon gradients -->
    <linearGradient id="blueTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F8BF9"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="tealGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="purpleBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#4F8BF9"/>
    </linearGradient>

    <!-- Subtle drop shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4F8BF9" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="600" height="180" rx="20" fill="url(#bgGrad)" stroke="#313244" stroke-width="1.5"/>

  <!-- ICON CONTAINER (Interlocking Time-Slots forming 'S') -->
  <g transform="translate(45, 30)" filter="url(#glow)">
    <!-- Top-left slot -->
    <rect x="0" y="0" width="34" height="34" rx="8" fill="url(#purpleBlue)"/>
    <!-- Top-middle slot -->
    <rect x="42" y="0" width="46" height="34" rx="8" fill="url(#blueTeal)"/>
    <!-- Top-right corner connector -->
    <rect x="96" y="0" width="24" height="34" rx="8" fill="#3B82F6" opacity="0.8"/>

    <!-- Middle-spine connecting 'S' -->
    <rect x="0" y="42" width="34" height="36" rx="8" fill="url(#blueTeal)"/>
    <rect x="42" y="42" width="78" height="36" rx="8" fill="url(#tealGreen)"/>

    <!-- Bottom curve of 'S' -->
    <rect x="0" y="86" width="24" height="34" rx="8" fill="#059669" opacity="0.8"/>
    <rect x="32" y="86" width="46" height="34" rx="8" fill="url(#tealGreen)"/>
    <rect x="86" y="86" width="34" height="34" rx="8" fill="#10B981"/>

    <!-- Clockwise dynamic accent dot (zero-clash indicator) -->
    <circle cx="103" cy="103" r="5" fill="#FFFFFF"/>
  </g>

  <!-- TYPOGRAPHY -->
  <!-- Brand Name -->
  <text x="195" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="4">
    SLOTT<tspan fill="#4F8BF9">I</tspan><tspan fill="#10B981">X</tspan>
  </text>

  <!-- Tagline / Subtitle -->
  <text x="198" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#89B4FA" letter-spacing="5">
    SMART ACADEMIC SCHEDULING
  </text>
</svg>
